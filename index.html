<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「疆味法盾」农业电商合规咨询平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background-color: #f3f4f6; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 414px; background-color: #ffffff; min-height: 100vh; position: relative; padding-bottom: 70px; }
    </style>
</head>
<body>
<div id="app">
    <header class="bg-green-600 text-white p-4 text-center font-bold text-lg sticky top-0 z-10">「疆味法盾」农业电商合规咨询平台</header>

    <div class="flex border-b">
        <div @click="tab = 'scan'" :class="tab === 'scan' ? 'border-green-600 text-green-600 border-b-2' : 'text-gray-500'" class="flex-1 text-center py-3 font-bold cursor-pointer">合同风险排查</div>
        <div @click="tab = 'qa'" :class="tab === 'qa' ? 'border-green-600 text-green-600 border-b-2' : 'text-gray-500'" class="flex-1 text-center py-3 font-bold cursor-pointer">大白话法律咨询</div>
    </div>

    <div v-if="tab === 'scan'" class="p-4">
        <p class="text-sm text-gray-500 mb-2">演示说明：在此粘贴合同条款文本进行风险分析</p>
        <textarea v-model="contractText" rows="4" class="w-full border rounded-lg p-2 text-sm focus:ring-green-500 focus:border-green-500 mb-4" placeholder="例如：买家可在收到水果后30天内无理由退款并要求十倍赔偿..."></textarea>
        
        <button @click="analyzeContract" :disabled="isLoading" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg flex justify-center items-center">
            <span v-if="isLoading">AI 读取中...</span>
            <span v-else>扫描风险</span>
        </button>

        <div v-if="scanResult" class="mt-6 border-t pt-4">
            <h3 class="font-bold text-gray-800 mb-2">分析结果：</h3>
            <div class="bg-gray-50 p-3 rounded text-sm text-gray-700 whitespace-pre-wrap leading-relaxed border border-gray-200">
                {{ scanResult }}
            </div>
        </div>
    </div>

    <div v-if="tab === 'qa'" class="p-4">
        <div class="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm mb-4">
            💡 遇到纠纷不知道怎么办？直接用大白话问 AI。
        </div>
        <textarea v-model="questionText" rows="3" class="w-full border rounded-lg p-2 text-sm focus:ring-blue-500 mb-4" placeholder="例如：我自家种的散装苹果发快递，包装上需要印生产日期吗？"></textarea>
        
        <button @click="askLegal" :disabled="isLoading" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg flex justify-center items-center">
            <span v-if="isLoading">查阅法条中...</span>
            <span v-else>立即咨询</span>
        </button>

        <div v-if="qaResult" class="mt-6">
            <h3 class="font-bold text-gray-800 mb-2">解答：</h3>
            <div class="bg-blue-50 p-4 rounded-lg text-sm text-gray-800 leading-relaxed whitespace-pre-wrap">
                {{ qaResult }}
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const tab = ref('scan');
            const contractText = ref('');
            const questionText = ref('');
            const scanResult = ref('');
            const qaResult = ref('');
            const isLoading = ref(false);

            // 模块一：合同流式扫描
            const analyzeContract = async () => {
                if(!contractText.value) return alert("请输入合同内容");
                isLoading.value = true;
                scanResult.value = ''; // 点击时清空上一次的结果
                try {
                    const res = await fetch(`/api/scan-contract`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: contractText.value })
                    });
                    
                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(`服务器报错: ${errorText}`);
                    }

                    // 开启水管接收数据流
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    isLoading.value = false; // 接到第一滴水，马上关闭按钮的转圈动画
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        scanResult.value += decoder.decode(value, {stream: true});
                    }
                } catch (e) {
                    scanResult.value = "系统调试信息：" + e.message;
                    isLoading.value = false;
                }
            };

            // 模块二：问答流式咨询
            const askLegal = async () => {
                if(!questionText.value) return alert("请输入你的问题");
                isLoading.value = true;
                qaResult.value = ''; // 点击时清空上一次的结果
                try {
                    const res = await fetch(`/api/legal-qa`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: questionText.value })
                    });

                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(`服务器报错: ${errorText}`);
                    }

                    // 开启水管接收数据流
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    isLoading.value = false; // 接到第一滴水，马上关闭按钮的转圈动画
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        qaResult.value += decoder.decode(value, {stream: true});
                    }
                } catch (e) {
                    qaResult.value = "系统调试信息：" + e.message;
                    isLoading.value = false;
                }
            };

            return { tab, contractText, questionText, scanResult, qaResult, isLoading, analyzeContract, askLegal }
        }
    }).mount('#app');
</script>
</body>
</html>
